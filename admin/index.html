<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>New Quest Ads</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--bg:#EEF5FA;--surface:#fff;--ink:#1A3A5C;--muted:#62798F;--line:#CAD9E6;--accent:#C9265F;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0F1D2C;--surface:#162839;--ink:#E6EEF6;--muted:#8FA4B8;--line:#2A4460;--accent:#FF7FAA;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;padding-inline:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
input[type=password]{font:16px ui-monospace,Consolas,monospace;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{flex-direction:row;align-items:center;gap:8px;font-weight:400}
button{font:600 15px inherit;padding:11px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{margin:0;font-size:13px;color:var(--bad);min-height:1.2em}
</style>
</head>

  <p id="msg" role="alert"></p>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  // document.open() only replaces a finished document; mid-load it appends.
  if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u8(SALT),iterations:ITER},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(STORE)}catch(e){}
  if(saved){
    try{const k=await crypto.subtle.importKey("raw",u8(saved),"AES-GCM",false,["decrypt"]);await open(k);return}
    catch(e){try{localStorage.removeItem(STORE)}catch(_){}}
  }
  const f=document.getElementById("f");f.hidden=false;document.getElementById("pw").focus();
  f.onsubmit=async e=>{
    e.preventDefault();
    const go=document.getElementById("go"),msg=document.getElementById("msg");
    go.disabled=true;go.textContent="Unlocking...";msg.textContent="";
    try{
      const k=await derive(document.getElementById("pw").value.trim());
      if(document.getElementById("rem").checked){try{localStorage.setItem(STORE,b64(await crypto.subtle.exportKey("raw",k)))}catch(_){}}
      await open(k);
    }catch(err){
      try{localStorage.removeItem(STORE)}catch(_){}
      msg.textContent="That password didn't work. Check it and try again.";go.disabled=false;go.textContent="Unlock";
    }
  };
})();
