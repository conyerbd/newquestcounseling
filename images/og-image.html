<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Open+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#B3D4E8;font-family:'Open Sans',sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       position:relative;overflow:hidden;color:#1A3A5C}
  .bar{position:absolute;top:0;left:0;width:100%;height:14px;background:#1A3A5C}
  .bar i{display:block;height:100%;width:62%;background:#E85A8F;border-right:4px solid #fff}
  .logo{height:190px;margin-bottom:26px}
  h1{font-family:'Nunito',sans-serif;font-weight:800;font-size:62px;line-height:1.1;text-align:center}
  h1 span{color:#C9265F}
  p.sub{font-size:27px;margin-top:20px;font-weight:600;text-align:center}
  .pills{display:flex;gap:16px;margin-top:34px}
  .pill{background:#fff;border:3px solid #1A3A5C;border-radius:14px;padding:12px 24px;
        font-family:'Nunito',sans-serif;font-weight:700;font-size:23px;
        box-shadow:5px 5px 0 0 rgba(26,58,92,.2)}
  .tag{position:absolute;bottom:30px;font-family:'Press Start 2P',cursive;font-size:13px;
       background:#1A3A5C;color:#F7D426;padding:9px 15px;border-radius:6px}
</style></head><body>
  <div class="bar"><i></i></div>
  <img class="logo" src="logo.svg" alt="">
  <h1>Life didn't come with a <span>walkthrough.</span></h1>
  <p class="sub">Individual, couples &amp; family therapy — Cincinnati, OH</p>
  <div class="pills">
    <div class="pill">Anthem</div>
    <div class="pill">UnitedHealthcare</div>
    <div class="pill">Sliding-Scale Self-Pay</div>
  </div>
  <div class="tag">FREE 15-MIN CONSULT</div>
</body></html>
